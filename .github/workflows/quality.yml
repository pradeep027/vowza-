name: Quality Gate

on:
  push:
    branches: [main]
  # Gate every pull request regardless of its base branch (e.g. PRs into
  # long-lived integration branches like chore/production-readiness-baseline),
  # not only PRs targeting main.
  pull_request:

# Phase 1 boundary: quality gate only.
# No deployment, no secrets, no Supabase access, no Vercel calls, no production mutation.
# Production deployment remains an explicit, controlled, manual operation.
#
# NOTE: This workflow lives at the REPOSITORY ROOT because GitHub Actions only
# reads .github/workflows/ from the root. The application itself is the nested
# vowza-event-connections-main/ directory, hence working-directory and
# cache-dependency-path below.

defaults:
  run:
    working-directory: vowza-event-connections-main

jobs:
  quality:
    name: typecheck / tests / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: vowza-event-connections-main/.nvmrc
          cache: npm
          cache-dependency-path: vowza-event-connections-main/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (full suite)
        # `npm test` is `vitest run` with vitest's default discovery glob, so
        # this runs every *.test.ts under src/ (46 files / 1130 tests as of the
        # Phase J runner reconciliation). New specs are picked up automatically.
        run: npm test

      - name: Production build
        run: npm run build

  lint-baseline:
    # Non-blocking visibility job for the recorded lint baseline.
    # Phase 1 does not fix the ~1,900-error debt; cleanup is a separate controlled effort.
    name: lint (non-blocking baseline)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: vowza-event-connections-main/.nvmrc
          cache: npm
          cache-dependency-path: vowza-event-connections-main/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: ESLint baseline report
        run: npm run lint
